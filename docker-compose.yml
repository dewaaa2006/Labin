services:
  postgres:
    image: postgres:16-alpine
    container_name: labin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labin_db
    ports:
      - "5432:5432"
    volumes:
      - labin_postgres_data:/var/lib/postgresql/data

volumes:
  labin_postgres_data:
